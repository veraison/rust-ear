[package]
name = "ear"
description = "EAT Attestation Results implementation"
version = "0.6.0"
edition = "2021"
repository = "https://github.com/veraison/rust-ear"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ear", "serde"]
categories = ["data-structures", "encoding"]


[package.metadata.docs.rs]
features = ["cose", "jwt", "log"]


[dependencies]
base64 = "0.23.1"
ciborium = "0.2.0"
cmw = "0.1.2"
cose-rust = { version = "0.1.2", optional = true }
hex = "0.4.3"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"], optional = true }
jsonwebtoken-openssl = { version = "2.0.0", optional = true }
lazy_static = "1.5.0"
openssl = { version = "0.10.54", optional = true }
phf = { version = "0.14.0", features = ["macros", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.93", features = ["raw_value"] }
thiserror = "2.0.16"
tracing = { version = "0.1.44", optional = true }


[features]
default = ["cose", "jwt", "aws-lc-rs"]
cose = ["dep:cose-rust", "dep:openssl", "dep:jsonwebtoken"]
jwt = ["dep:jsonwebtoken"]

# jsonwebtoken's JWT crypto is backed by a pluggable CryptoProvider. 

# aws-lc-rs remains the (the previous hardcoded default), and openssl requires ear to install the provider itself before any cryptographic operations.
aws-lc-rs = ["jwt", "jsonwebtoken/aws_lc_rs"]
openssl = ["jwt", "dep:jsonwebtoken-openssl"]

# This feature is used to enable logging in the library.
# Some of the functions have silent behaviors, so logging is useful to debug and trace.
log = ["dep:tracing"]

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
